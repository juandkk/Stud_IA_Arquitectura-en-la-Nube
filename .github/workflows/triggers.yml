name: triggers

on:
  push:
    branches:
      - main
      - aprendiendo-github-actions
    paths:
      - '**.py'

  schedule:
    - cron: '25 6,15 * * *'

  pull_request:
    types:
      - opened
      - labeled
      - closed

jobs:
  hola-mundo:
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Hola mundo
        run: python .github/script/saludo.py